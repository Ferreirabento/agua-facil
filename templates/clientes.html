<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes</title>
</head>
<body>
    {% extends "base.html" %}
    {% block title %} Clientes {% endblock %}
    {% block content %}

    <h1>Clientes</h1>

    <a href="{{ url_for('novo_cliente') }}"> Novo Cliente</a>

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Telefone</th>
            </tr>
        </thead>
        <tbody>
            {% for cliente in clientes %}
            <tr>
                <td>{{cliente["nome"]}}</td>
                <td>{{cliente["telefone"]}}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% endblock %}
</body>
</html>
